name: Dispatch news notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/news_calendar/push_updates.py'
      - '.github/workflows/dispatch-news-notifications.yml'
permissions:
  contents: write
concurrency:
  group: official-news-calendar
  cancel-in-progress: false
jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/news_calendar/requirements.txt
      - run: python -m unittest discover -s scripts/news_calendar -p 'test_push_updates.py' -v
      - name: Configure repository writer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Dispatch due notifications
        id: dispatch
        continue-on-error: true
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          CI_PUSH_STATE_COMMIT: '1'
        run: python scripts/news_calendar/push_updates.py
      - name: Publish notification health
        if: always()
        run: |
          git add news-alert/push-state.json news-alert/push-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update news notification health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report sender failure
        if: steps.dispatch.outcome == 'failure'
        run: exit 1
